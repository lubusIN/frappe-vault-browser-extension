name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      HAS_CHROME_SECRETS: ${{ secrets.CHROME_EXTENSION_ID != '' && secrets.CHROME_CLIENT_ID != '' && secrets.CHROME_CLIENT_SECRET != '' && secrets.CHROME_REFRESH_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run compile

      - name: Run unit tests
        run: npm test

      - name: Build extension packages (Chrome & Firefox)
        run: |
          npm run zip
          npm run zip:firefox

      - name: Get current timestamp
        id: timestamp
        run: echo "datetime=$(date -u +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Upload build artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: .output/*.zip
          retention-days: 14

      # -------------------------------------------------------------
      # 1. Rolling Dev Release (triggered on each push/merge to main)
      # -------------------------------------------------------------
      - name: Prepare dev release assets
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p .output/dev-assets
          cp .output/*-chrome.zip .output/dev-assets/vault-browser-extension-dev-chrome.zip
          cp .output/*-firefox.zip .output/dev-assets/vault-browser-extension-dev-firefox.zip
          cp .output/*-sources.zip .output/dev-assets/vault-browser-extension-dev-sources.zip
          cd .output/dev-assets
          sha256sum *.zip > SHA256SUMS.txt

      - name: Update moving dev git tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa dev -m "Rolling dev build for commit ${{ github.sha }}"
          git push origin dev --force

      - name: Publish Rolling Dev Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: 'Development Build (Latest)'
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: .output/dev-assets/*
          body: |
            ### 🛠️ Frappe Vault Extension - Rolling Dev Build

            Automated development build continuously generated from the [`main`](https://github.com/${{ github.repository }}/tree/main) branch.

            - **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            - **Updated at:** ${{ steps.timestamp.outputs.datetime }} UTC

            #### 📦 Downloads
            - **Chrome / Brave / Edge:** [`vault-browser-extension-dev-chrome.zip`](https://github.com/${{ github.repository }}/releases/download/dev/vault-browser-extension-dev-chrome.zip)
            - **Firefox:** [`vault-browser-extension-dev-firefox.zip`](https://github.com/${{ github.repository }}/releases/download/dev/vault-browser-extension-dev-firefox.zip)
            - **Firefox Source Code:** [`vault-browser-extension-dev-sources.zip`](https://github.com/${{ github.repository }}/releases/download/dev/vault-browser-extension-dev-sources.zip)
            - **Checksums:** [`SHA256SUMS.txt`](https://github.com/${{ github.repository }}/releases/download/dev/SHA256SUMS.txt)

            > ⚠️ **Notice:** Development builds reflect the latest unreleased code and may be unstable. For production use, install from [Official Releases](https://github.com/${{ github.repository }}/releases).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 2. Tagged Release (triggered on tag push like v1.0.0)
      # -------------------------------------------------------------
      - name: Prepare tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p .output/tagged-assets
          cp .output/*.zip .output/tagged-assets/
          cd .output/tagged-assets
          sha256sum *.zip > SHA256SUMS.txt

      - name: Publish Tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          overwrite_files: true
          files: .output/tagged-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 3. Publish to Chrome Web Store (on official tagged release)
      # -------------------------------------------------------------
      - name: Submit to Chrome Web Store
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_CHROME_SECRETS == 'true'
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
